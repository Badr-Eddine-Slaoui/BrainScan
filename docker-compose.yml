x-app-common: &app-common
  image: brainscan-app:latest
  build:
    context: .
    dockerfile: ./docker/app/Dockerfile
    args:
      APP_UID: "${APP_UID}"
      APP_GID: "${APP_GID}"
  user: "${APP_UID}:${APP_GID}"
  working_dir: /opt/project
  restart: unless-stopped
  volumes:
    - .:/opt/project
    - ./data:/opt/project/data
    - ./model:/opt/project/model
  environment: &app-env
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: /opt/project
    HOME: /home/appuser
    MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI}"
    MLFLOW_EXPERIMENT_NAME: "${MLFLOW_EXPERIMENT_NAME}"
    MLFLOW_MODEL_NAME: "${MLFLOW_MODEL_NAME}"
    MLFLOW_MODEL_STAGE: "${MLFLOW_MODEL_STAGE}"
    API_ADMIN_KEY: "${API_ADMIN_KEY}"

services:

  mlflow-postgres:
    image: postgres:17-alpine
    container_name: mlflow-postgres
    restart: always
    environment:
      POSTGRES_DB: "${MLFLOW_POSTGRES_DB}"
      POSTGRES_USER: "${MLFLOW_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${MLFLOW_POSTGRES_PASSWORD}"
    ports:
      - "${MLFLOW_POSTGRES_PORT}:5432"
    volumes:
      - mlflow_pgtables:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER} -d ${MLFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      mlflow-postgres:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: ./docker/mlflow/Dockerfile
      args:
        APP_UID: "${APP_UID}"
        APP_GID: "${APP_GID}"
    image: brainscan-mlflow:latest
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${MLFLOW_POSTGRES_USER}:${MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/${MLFLOW_POSTGRES_DB}
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  fastapi:
    <<: *app-common
    container_name: fastapi
    environment:
      <<: *app-env
    ports:
      - "${FASTAPI_PORT}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  streamlit:
    <<: *app-common
    container_name: streamlit
    environment:
      <<: *app-env
      API_URL: http://fastapi:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${STREAMLIT_PORT}:8501"
    depends_on:
      fastapi:
        condition: service_started
    command:
      - streamlit
      - run
      - app/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

volumes:
  mlflow_pgtables:
  pgadmin_data:
  mlflow_artifacts: